name: GCS MCP Server CI

on:
  push:
    branches:
      - main
    paths:
      - 'experimental/gcs/**'
      - '.github/workflows/gcs-ci.yml'
  pull_request:
    paths:
      - 'experimental/gcs/**'
      - '.github/workflows/gcs-ci.yml'

jobs:
  functional-tests:
    name: GCS MCP Server Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The per-server dirs have no lockfile, so `npm install` resolves fresh from
    # the registry every run, and current releases trip an npm arborist bug
    # ("Cannot read properties of null (reading 'edgesOut')") in peer-set
    # resolution. That happens on any runner, including the old self-hosted
    # one, and legacy peer-dep resolution avoids it.
    env:
      npm_config_legacy_peer_deps: 'true'

    defaults:
      run:
        working-directory: experimental/gcs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Install server dependencies
        run: npm run install-all

      - name: Build project
        run: npm run build

      - name: Run functional tests
        run: npm run test:run

  integration-tests:
    name: GCS MCP Server Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The per-server dirs have no lockfile, so `npm install` resolves fresh from
    # the registry every run, and current releases trip an npm arborist bug
    # ("Cannot read properties of null (reading 'edgesOut')") in peer-set
    # resolution. That happens on any runner, including the old self-hosted
    # one, and legacy peer-dep resolution avoids it.
    env:
      npm_config_legacy_peer_deps: 'true'

    defaults:
      run:
        working-directory: experimental/gcs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Install server dependencies
        run: npm run ci:install

      - name: Run integration tests
        run: npm run test:integration
